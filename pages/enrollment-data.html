<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>try{if(localStorage.getItem("lps_theme")==="dark")document.documentElement.classList.add("dark-mode-preload")}catch(error){}</script>
<title>Enrollment Data — San Roque ES Realtime Enrollment Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css" />
<link rel="icon" type="image/png" href="../assets/favicon.png" />
</head>
<body>
<div class="app-shell">
  <div id="sidebarMount"></div>
  <div class="main-area">
    <div id="topbarMount"></div>
    <main class="page">
      <div class="page-header">
        <div>
          <h1>Enrollment Data</h1>
          <p class="desc">Section enrollment by grade level, adviser, and gender</p>
        </div>
      </div>

      <div id="enrollmentAlert" class="form-alert" style="display:none;"></div>
      <div id="yearSwitcherMount"></div>

      <section class="panel enrollment-panel">
        <div class="panel-header enrollment-panel-header">
          <div>
            <span class="eyebrow">Enrollment summary</span>
            <h3 id="enrollmentTitle">School year</h3>
          </div>
          <button class="btn btn-secondary" id="syncEnrollmentBtn" type="button">Sync counts to sheet</button>
          <div class="enrollment-metrics" aria-label="Enrollment totals">
            <div class="enrollment-metric male-metric"><span>Male</span><strong id="enrollmentTotalMale">—</strong></div>
            <div class="enrollment-metric female-metric"><span>Female</span><strong id="enrollmentTotalFemale">—</strong></div>
            <div class="enrollment-metric total-metric"><span>Overall total</span><strong id="enrollmentGrandTotal">—</strong></div>
          </div>
        </div>
        <div class="enrollment-table-wrap">
          <table class="data-table enrollment-table">
            <thead>
              <tr><th>Grade Level</th><th>Section</th><th>Adviser</th><th class="number-cell">Male</th><th class="number-cell">Female</th><th class="number-cell">Total</th></tr>
            </thead>
            <tbody id="enrollmentTableBody">
              <tr><td colspan="6" class="state-row">Loading enrollment data...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="../js/app-config.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/demo-data.js"></script>
<script src="../js/cache.js"></script>
<script src="../js/sheets-api.js"></script>
<script src="../js/firestore-api.js"></script>
<script src="../js/school-year.js"></script>
<script src="../js/enrollment-data.js"></script>
</body>
</html>
