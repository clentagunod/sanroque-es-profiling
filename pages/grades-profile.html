<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>try{if(localStorage.getItem("lps_theme")==="dark")document.documentElement.classList.add("dark-mode-preload")}catch(error){}</script>
<title>Grades Profile — San Roque ES Realtime Enrollment Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css" />
<link rel="icon" type="image/png" href="../assets/favicon.png" />
</head>
<body>
<div class="app-shell"><div id="sidebarMount"></div><div class="main-area"><div id="topbarMount"></div><main class="page">
  <div class="page-header"><div><h1>Grades Profile</h1><p class="desc">Learner subject grades and average by school year</p></div><button class="btn btn-primary" id="exportGradesBtn" style="width:auto;">Export Excel</button></div>
  <div id="yearSwitcherMount"></div>
  <div class="grades-filter-toolbar">
    <div class="search-box"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="gradesSearch" type="search" placeholder="Search by name or Learner ID..." /></div>
    <select class="select-filter" id="gradesGradeFilter"><option value="">All Grade Levels</option><option>Kinder</option><option>Grade 1</option><option>Grade 2</option><option>Grade 3</option><option>Grade 4</option><option>Grade 5</option><option>Grade 6</option></select>
    <select class="select-filter" id="gradesProgramFilter"><option value="">All Programs</option><option value="4Ps">4Ps Beneficiaries</option><option value="IP">IP Learners</option><option value="SNED">SNED Learners</option><option value="ARAL">ARAL Tagged</option><option value="Muslim">Muslim Learners</option></select>
    <select class="select-filter" id="gradesGenderFilter"><option value="">All Genders</option><option>Male</option><option>Female</option></select>
  </div>
  <div class="stat-pill-row" id="gradesSummary"></div>
  <section class="panel"><div class="panel-header grades-panel-header"><div><span class="eyebrow">Academic performance</span><h3>Subject grades</h3></div><div class="grades-sort-controls"><label for="gradesSort">Sort by</label><select id="gradesSort"><option value="learnerId">Learner ID</option><option value="name">Name</option><option value="gradeLevel">Grade level</option><option value="section">Section</option><option value="average">Average</option></select><select id="gradesSortDirection" aria-label="Sort direction"><option value="desc">Descending</option><option value="asc">Ascending</option></select></div></div><div class="grades-table-wrap"><table class="data-table grades-profile-table"><thead><tr><th>Learner</th><th>Grade</th><th>Section</th><th>Filipino</th><th>English</th><th>Math</th><th>Science</th><th>AralPan</th><th>ESP</th><th>Music</th><th>Arts</th><th>PE</th><th>Health</th><th>EPP</th><th>Mother Tongue</th><th>Average</th></tr></thead><tbody id="gradesTableBody"><tr><td colspan="16" class="state-row">Loading grades...</td></tr></tbody></table></div><div class="pagination"><span id="gradesPageInfo">—</span><div class="pager-btns" id="gradesPagerBtns"></div></div></section>
</main></div></div>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script><script src="../js/app-config.js"></script>
<script src="../js/firebase-config.js"></script><script src="../js/auth.js"></script><script src="../js/icons.js"></script><script src="../js/shell.js"></script><script src="../js/demo-data.js"></script><script src="../js/cache.js"></script><script src="../js/sheets-api.js"></script><script src="../js/firestore-api.js"></script><script src="../js/school-year.js"></script><script src="../js/grades-profile.js"></script>
</body></html>
