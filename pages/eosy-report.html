<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>try{if(localStorage.getItem("lps_theme")==="dark")document.documentElement.classList.add("dark-mode-preload")}catch(error){}</script>
<title>EOSY Status Report - San Roque ES</title>
<link rel="stylesheet" href="../css/styles.css" /><link rel="icon" type="image/png" href="../assets/favicon.png" />
</head>
<body><div class="app-shell"><div id="sidebarMount"></div><div class="main-area"><div id="topbarMount"></div><main class="page">
<div class="page-header"><div><h1>EOSY Status Report</h1><p class="desc">End-of-school-year learner status by grade and section</p></div></div>
<div class="form-alert" id="eosyDemoBanner" style="display:none;background:var(--warning-100);color:var(--warning-600);">Connect your Google Sheet to see live EOSY data.</div>
<div id="yearSwitcherMount"></div>
<div class="toolbar"><div class="search-box"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="eosySearch" type="search" placeholder="Search learner, LRN, or section..." /></div><select class="select-filter" id="eosyStatusFilter"><option value="">All EOSY Statuses</option><option>Promoted</option><option>Retained</option><option>Dropped Out</option></select><select class="select-filter" id="eosyGradeFilter"><option value="">All Grade Levels</option><option>Kinder</option><option>Grade 1</option><option>Grade 2</option><option>Grade 3</option><option>Grade 4</option><option>Grade 5</option><option>Grade 6</option></select><button class="btn btn-secondary" id="eosySortDirection" type="button">A-Z</button></div>
<section class="panel"><div class="panel-header"><h3>EOSY Statuses</h3><span class="panel-meta" id="eosyResultCount"></span></div><div style="overflow-x:auto"><table class="data-table"><thead><tr><th>Learner ID</th><th>Learner</th><th>Grade</th><th>Section</th><th>EOSY Status</th></tr></thead><tbody id="eosyStatusTableBody"><tr><td colspan="5" class="state-row">Loading EOSY report...</td></tr></tbody></table></div></section>
<div class="pagination"><span id="eosyPageInfo">-</span><div class="pager-btns" id="eosyPagerBtns"></div></div>
</main></div></div>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script><script src="../js/app-config.js"></script><script src="../js/firebase-config.js"></script><script src="../js/auth.js"></script><script src="../js/icons.js"></script><script src="../js/shell.js"></script><script src="../js/demo-data.js"></script><script src="../js/cache.js"></script><script src="../js/sheets-api.js"></script><script src="../js/firestore-api.js"></script><script src="../js/school-year.js"></script><script src="../js/eosy-report.js"></script>
</body></html>
